<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
</head>
<body>
<h1>Long polling</h1>
</body>
<script>
   const makeRequest= async ()=>{
       try{
           const res = await fetch("http://localhost:3000/messages")
           const data = await res.json()

           console.log(data)
           makeRequest()
       }catch (error){
           console.log(error)
           makeRequest()
       }
   }
   makeRequest()
</script>
</html>
